<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f8f8"><title>龜記茗品｜限量優惠券領取</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f8f8;color:#303030;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif}.page{width:min(448px,calc(100% - 28px));margin:0 auto;padding:0 0 40px}.head{text-align:center;padding:0 0 24px}.logo{width:118px;height:100px;object-fit:cover;object-position:top;border-radius:0 0 55px 55px;display:block;margin:0 auto 14px}.brand{font-size:18px;font-weight:700;margin:0 0 9px}.sub{font-size:16px;color:#666;margin:0}.insta{margin:32px auto 30px;display:block;color:#07533d;text-decoration:none;font-size:27px;width:30px}.insta svg{width:26px;height:26px}.carousel{position:relative}.slide{display:none}.slide.active{display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:#222b;color:white;font-size:24px;cursor:pointer;width:34px;height:34px}.prev{left:8px}.next{right:8px}.hero{width:100%;border-radius:16px;display:block;box-shadow:0 3px 8px #0002}.dots{display:flex;gap:16px;justify-content:center;padding:11px 0 22px}.dot{width:12px;height:12px;border-radius:50%;border:2px solid #09543f;background:transparent}.dot:first-child{background:#09543f}.card{background:white;border-radius:16px;overflow:hidden}.voucher{width:100%;display:block}.content{padding:18px 20px 20px}.titleline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}.status{font-size:13px;background:#0d503c;color:white;padding:4px 8px;border-radius:5px}.timer{background:#f1f1f1;border-radius:12px;margin:16px 0 20px;padding:15px 16px}.timer small{display:block;color:#777;font-size:14px;margin-bottom:10px}.time{text-align:center;font-size:18px;font-weight:600;letter-spacing:1px}.clock{color:#07543e;margin-right:9px}.desc{font-size:14px;line-height:1.8;margin-bottom:24px}.btn{display:block;text-align:center;background:#0e513e;color:white;text-decoration:none;font-weight:700;border-radius:12px;padding:14px 10px;font-size:17px}.note{font-size:11px;color:#999;text-align:center;margin:18px 8px 0}.settings{margin:18px 0;background:#fff;border-radius:12px;padding:13px 16px;font-size:14px}.settings summary{cursor:pointer;font-weight:600;color:#0e513e}.settings-body{padding-top:12px}.settings label{display:block;margin:8px 0}.settings input{display:block;width:100%;padding:9px;margin-top:5px;border:1px solid #ccc;border-radius:7px;font:inherit}.setting-actions{display:flex;gap:10px;margin:12px 0}.setting-actions button{background:#0e513e;color:white;border:0;border-radius:7px;padding:10px 13px;cursor:pointer}.settings p{color:#777;line-height:1.6;font-size:12px}.dots button{cursor:pointer}.dots button:focus-visible,.arrow:focus-visible,.btn:focus-visible{outline:3px solid #e6a638}</style></head><body><main class="page"><header class="head"><img class="logo" src="logo_reference.png" alt="龜記茗品標誌"><h1 class="brand">龜記茗品</h1><p class="sub">限量優惠券領取</p><span class="insta" aria-label="Instagram 圖示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/></svg></span></header><div class="carousel"><img class="hero slide active" src="tea_main.png" alt="龜記茶飲主圖"><img class="hero slide" src="tea_peach.png" alt="龜記蜜桃烏龍茶"><img class="hero slide" src="tea_black.png" alt="龜記三十三茶王極品紅茶"><button class="arrow prev" aria-label="上一張" onclick="move(-1)">‹</button><button class="arrow next" aria-label="下一張" onclick="move(1)">›</button></div><div class="dots" aria-label="輪播指示"><button class="dot" onclick="show(0)" aria-label="第一張"></button><button class="dot" onclick="show(1)" aria-label="第二張"></button><button class="dot" onclick="show(2)" aria-label="第三張"></button></div><section class="card"><img class="voucher" src="voucher_75.png" alt="飲品兌換券75元"><div class="content"><div class="titleline">限時優惠開放中 <span class="status" id="status">時間未設定</span></div><div class="timer"><small>距離結束還有</small><div class="time"><span class="clock">◷</span><span id="countdown">請設定活動結束時間</span></div></div><div class="desc">🛒 活動說明<br>限時優惠，售完為止！</div><a class="btn" href="https://lin.ee/QOOcapg" rel="noopener noreferrer">立即領取</a></div></section><details class="settings"><summary>活動時間調整</summary><div class="settings-body"><label>活動開始時間<input type="datetime-local" id="startAt"></label><label>活動結束時間<input type="datetime-local" id="endAt"></label><div class="setting-actions"><button type="button" onclick="saveTimes()">儲存時間</button><button type="button" onclick="resetTimes()">清除設定</button></div><p>此設定只儲存在目前瀏覽器。若要讓所有訪客使用相同活動時間，請在部署前修改 index.html 內的 DEFAULT_START 與 DEFAULT_END。</p></div></details><p class="note">依提供截圖還原。輪播圖取自截圖，非原始高畫質素材。</p></main><script>let current=0;function show(i){current=(i+3)%3;document.querySelectorAll('.slide').forEach((el,n)=>el.classList.toggle('active',n===current));document.querySelectorAll('.dot').forEach((el,n)=>el.style.background=n===current?'#09543f':'transparent')}function move(d){show(current+d)}const DEFAULT_START='';const DEFAULT_END='2026-11-06T13:30';const $=id=>document.getElementById(id);function getTimes(){return {start:localStorage.getItem('guiji_start_1106')||DEFAULT_START,end:localStorage.getItem('guiji_end_1106')||DEFAULT_END}}function updateTimer(){const t=getTimes(),now=Date.now(),start=t.start?new Date(t.start).getTime():NaN,end=t.end?new Date(t.end).getTime():NaN;const state=$('status'),counter=$('countdown');if(!Number.isFinite(end)){state.textContent='時間未設定';counter.textContent='請設定活動結束時間';return}if(Number.isFinite(start)&&now<start){state.textContent='未開始';counter.textContent='尚未開始';return}if(now>=end){state.textContent='已結束';counter.textContent='00天 00時 00分 00秒';return}state.textContent='進行中';let seconds=Math.floor((end-now)/1000);const d=Math.floor(seconds/86400);seconds%=86400;const h=Math.floor(seconds/3600);seconds%=3600;const m=Math.floor(seconds/60);const sec=seconds%60;counter.textContent=`${d}天 ${String(h).padStart(2,'0')}時 ${String(m).padStart(2,'0')}分 ${String(sec).padStart(2,'0')}秒`}function saveTimes(){const a=$('startAt').value,b=$('endAt').value;if(!b){alert('請填寫活動結束時間');return}if(a&&new Date(a)>=new Date(b)){alert('結束時間必須晚於開始時間');return}localStorage.setItem('guiji_start_1106',a);localStorage.setItem('guiji_end_1106',b);updateTimer();alert('已儲存在此瀏覽器')}function resetTimes(){localStorage.removeItem('guiji_start_1106');localStorage.removeItem('guiji_end_1106');$('startAt').value=DEFAULT_START;$('endAt').value=DEFAULT_END;updateTimer()}const saved=getTimes();$('startAt').value=saved.start;$('endAt').value=saved.end;updateTimer();setInterval(updateTimer,1000);</script></body></html>
